[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vecdecide"
version = "0.1.0"
description = "Small, fast decisions over embeddings: choice, yes/no and score questions from heads and outcome stores."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
embedding = ["sentence-transformers>=3.0"]
dev = ["pytest>=7"]

[project.scripts]
vecdecide = "vecdecide.__main__:main"

[tool.setuptools.packages.find]
include = ["vecdecide*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
